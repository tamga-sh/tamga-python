name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Runs on every push to main: opens/updates a release PR that accumulates
  # the changelog, or (when a release PR is merged) tags + creates the
  # GitHub Release directly.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Mint a short-lived GitHub App installation token for release-please.
      # The default GITHUB_TOKEN cannot be used here: GitHub's loop-prevention
      # rule means a PR it authors never triggers `pull_request` workflows, so
      # CI never reports on the release PR and branch protection blocks the
      # merge forever. A GitHub App-authored PR does trigger workflows.
      # Scoped to release-please only — the publish job authenticates to PyPI
      # via OIDC Trusted Publishing and must not see this token.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # NOTE: `release-type` is deliberately NOT passed here. Supplying it
          # alongside `config-file` puts the action in standalone mode, where the
          # config file — and therefore its `extra-files` — is ignored. That is why
          # `src/tamga/__init__.py` was never bumped by any release: 1.0.1 through
          # 1.0.4 all left it stranded. The release type lives in the config file.
          # tamga-c and tamga-go pass config-file alone and their extra-files do update.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml's version but knows nothing about
      # uv.lock, which repeats that version for the root package. Left alone
      # the lockfile drifts one release behind on every cycle and only gets
      # corrected by accident, whenever someone next runs uv locally.
      # These steps run only while a release PR is open, and push the refreshed
      # lockfile onto that same PR branch so the bump lands as one coherent
      # change. They are scoped to the release-please job — the publish job
      # below never sees the App token and keeps authenticating via OIDC.
      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.pr
        timeout-minutes: 10

      - name: Sync uv.lock with the bumped version
        if: steps.release.outputs.pr
        timeout-minutes: 10
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version"
          git push

  # Runs only right after release-please's own step above actually created a
  # release (i.e. this run was the release-PR-merge push) — builds and
  # publishes to PyPI via Trusted Publishing (OIDC), no long-lived API token
  # stored as a repo secret.
  #
  # Deliberately gated via this job's `needs`/`if` on the release-please
  # job's output, in the SAME workflow run, rather than a separate
  # `on: release: types: [published]` trigger: release-please-action
  # creates that GitHub Release using this workflow's own GITHUB_TOKEN, and
  # GitHub does not let GITHUB_TOKEN-authored events trigger further
  # workflow runs (loop-prevention) — so a `release: published` trigger
  # here would simply never fire.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        timeout-minutes: 10
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
