[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tamga-sdk"
version = "1.1.1"
description = "Official Python SDK for Tamga. Integrate license activation, offline verification, and machine management into your Python applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9.2"
authors = [
    { name = "Tamga", email = "oss@tamga.sh" },
]
keywords = [
    "licensing",
    "software-licensing",
    "license-key",
    "activation",
    "entitlements",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://tamga.sh"
Repository = "https://github.com/tamga-sh/tamga-python"
Issues = "https://github.com/tamga-sh/tamga-python/issues"
Documentation = "https://github.com/tamga-sh/tamga-python/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "ruff",
    # mypy 2.0 dropped support for `python_version = "3.9"` as a check
    # target (see [tool.mypy] below) — pin to the 1.x series until this
    # SDK's `requires-python` floor moves past 3.9.
    "mypy>=1.8,<3",
    "pytest",
    "pytest-cov",
    "cryptography>=42",
    "httpx>=0.27",
]

# This SDK ships no CLI in v1 — intentionally left empty.
[project.scripts]

[tool.hatch.build.targets.wheel]
packages = ["src/tamga"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# Docstrings are Google-style throughout (see CLAUDE.md) — this convention
# preset also resolves ruff's mutually-exclusive D-rule pairs (e.g.
# D203/D211, D212/D213) so `ruff check` doesn't flag both sides of the same
# choice. Only test files are exempted below (the D ruleset targets the public
# API surface — tests aren't part of the published API).
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Standalone illustrative scripts, not part of the published package/API
# surface the D ruleset targets.
"examples/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.9"
packages = ["tamga"]
mypy_path = "src"
# Without this, mypy's default follow_imports="normal" fully re-typechecks
# transitive dependency *source* (e.g. httpx -> anyio) against our pinned
# python_version, and breaks on syntax those libraries only support on
# newer Python (e.g. anyio's `match` statements need 3.10+). We only want
# our own package checked, not third-party internals.
follow_imports = "silent"

# `follow_imports = "silent"` still *parses* an imported module (to extract
# types) before discarding its errors — that's not enough for anyio, whose
# installed source itself uses 3.10+ `match` syntax that fails to parse
# under our pinned python_version. "skip" avoids parsing it at all,
# treating it as untyped (`Any`) instead of raising a fatal syntax error.
[[tool.mypy.overrides]]
module = "anyio.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tamga --cov-report=term-missing"
